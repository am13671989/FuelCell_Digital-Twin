x-app: &app
  image: fcdt-server
  build:
    context: ..
    dockerfile: server/Dockerfile
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    FMU_DIR: /fmu
    API_URL: http://api:8000
  volumes: ["fmu:/fmu"]
services:
  redis:
    image: redis:7
  fmu-builder:
    <<: *app
    command: ["sh", "/build_fmu.sh"]
    profiles: ["build"]
  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on: [redis]
    restart: unless-stopped
  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    depends_on: [redis]
    restart: unless-stopped
  dashboard:
    <<: *app
    command: ["python", "-m", "app.dashboard"]
    ports: ["8050:8050"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  fmu: {}
