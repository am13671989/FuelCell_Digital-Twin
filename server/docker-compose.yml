# Project name is fixed so this stack never collides with other Docker projects on the server.
name: fcdt
x-app: &app
  image: fcdt-server
  build:
    context: ..
    dockerfile: server/Dockerfile
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    FMU_DIR: /fmu
    API_URL: http://api:8000
  volumes: ["fmu:/fmu"]
services:
  redis:
    image: redis:7
    restart: unless-stopped
  fmu-builder:
    <<: *app
    command: ["sh", "/build_fmu.sh"]
    profiles: ["build"]
  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # no published port: only the dashboard (same Docker network) talks to the API
    depends_on: [redis]
    restart: unless-stopped
  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on: [redis]
    restart: unless-stopped
  dashboard:
    <<: *app
    command: ["python", "-m", "app.dashboard"]
    # DASH_BIND=127.0.0.1 if you put an existing reverse proxy in front; DASH_PORT = free host port
    ports: ["${DASH_BIND:-0.0.0.0}:${DASH_PORT:-8050}:8050"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  fmu: {}
